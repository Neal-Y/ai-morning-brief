<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B121A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sift" />
    <title>Sift</title>
    <!-- Start today's /api/feed request while the JS bundle is still
         downloading, so network and JS parse overlap instead of queueing
         (web/src/feedLoader.ts picks it up). Feed route only: it's the PWA
         start_url and where the morning push lands. -->
    <script>
      (function () {
        try {
          if (location.pathname !== '/') return;
          var p = {};
          new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' })
            .formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
          var date = p.year + '-' + p.month + '-' + p.day; // same as getTaipeiDateString()
          window.__siftFeed = {
            date: date,
            promise: fetch('/api/feed?date=' + date).then(function (r) {
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.json();
            }),
          };
          // Never surface as an unhandled rejection; feedLoader falls back to its own fetch.
          window.__siftFeed.promise.catch(function () {});
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon-512.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <!-- Fonts load without blocking first paint (display=swap + preload→stylesheet
         swap): the splash and feed render in system fonts and swap in when the
         webfonts land. Noto Serif TC is served in unicode-range slices, so only
         the glyphs on screen are fetched. Unused 600 weights dropped. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;0,8..60,900;1,8..60,400;1,8..60,700;1,8..60,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;0,8..60,900;1,8..60,400;1,8..60,700;1,8..60,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;700;900&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
